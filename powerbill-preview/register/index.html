<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · PowerBill</title><style>body{margin:0;background:#f7f5ef;color:#0f1912;font:16px Inter,system-ui}.w{max-width:470px;margin:5vh auto;padding:24px}.b{font:700 24px system-ui;color:#16452e}.card{margin-top:24px;background:#fff;border:1px solid #dcd8cc;border-radius:18px;padding:28px}h1{font-size:36px;margin:8px 0}p{color:#667085}label{display:block;font-weight:650;margin:16px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #aaa;border-radius:10px;font-size:16px}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:999px;background:#16452e;color:white;font-weight:750;font-size:16px}a{color:#16452e}.req{font-size:13px;color:#667085;line-height:1.8}.ok{color:#16452e}</style></head><body><main class="w"><div class="b">◯ PowerBill</div><div class="card"><small>CUSTOMER REGISTRATION</small><h1>Create your account.</h1><p>Register securely to manage your electricity billing.</p><form onsubmit="event.preventDefault();location.href='/login/'"><label>Full name</label><input required autocomplete="name"><label>Email address</label><input type="email" required autocomplete="email"><label>Phone number</label><input type="tel" required autocomplete="tel"><label>Password</label><input id="pw" type="password" minlength="8" required autocomplete="new-password" oninput="check()"><div id="req" class="req">○ 8+ characters &nbsp; ○ uppercase &nbsp; ○ lowercase &nbsp; ○ number</div><button>Create account</button></form><p>Already registered? <a href="/login/">Sign in</a></p></div></main><script>function check(){let v=pw.value,r=document.getElementById('req');r.innerHTML=[v.length>=8,/[A-Z]/.test(v),/[a-z]/.test(v),/[0-9]/.test(v)].map((x,i)=>(x?'✓ ':'○ ')+['8+ characters','uppercase','lowercase','number'][i]).join(' &nbsp; ');r.className='req '+(v.length>=8&&/[A-Z]/.test(v)&&/[a-z]/.test(v)&&/[0-9]/.test(v)?'ok':'')}</script></body></html>
