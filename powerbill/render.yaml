# Deploy from powerbill-production. Enter secrets in Render, never in Git.
services:
  - type: web
    name: powerbill-api
    branch: powerbill-production
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: cd powerbill/backend && pip install -r requirements.txt
    startCommand: cd powerbill/backend && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: powerbill-app
    branch: powerbill-production
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd powerbill/frontend && npm ci && npm run build
    startCommand: cd powerbill/frontend && npm start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: POWERBILL_API_ORIGIN
        sync: false
